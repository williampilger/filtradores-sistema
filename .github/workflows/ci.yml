name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: filtradores
          MYSQL_USER: filt
          MYSQL_PASSWORD: filt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/filtradores
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/filtradores_test
      REDIS_URL: redis://127.0.0.1:6379
      ENCRYPTION_KEY: Y2ktY2ktY2ktY2ktY2ktY2ktY2ktY2ktY2ktY2ktY2k=
      QR_SIGNING_SECRET: ci-qr-secret

    steps:
      - uses: actions/checkout@v4
        with:
          path: filtradores-sistema
      # dependência `file:../payment-gateways` (repo PRIVADO): exige o secret PAYMENT_GATEWAYS_TOKEN
      # (fine-grained PAT com "Contents: read" no repo williampilger/payment-gateways) - ver ToDo.md
      - uses: actions/checkout@v4
        with:
          repository: williampilger/payment-gateways
          path: payment-gateways
          token: ${{ secrets.PAYMENT_GATEWAYS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: payment-gateways
        working-directory: payment-gateways
        run: npm ci && npm run build
      - name: banco de teste
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS filtradores_test"
      - working-directory: filtradores-sistema
        run: npm ci
      - working-directory: filtradores-sistema
        run: npm run db:generate
      - working-directory: filtradores-sistema
        run: npm run db:migrate:deploy
      - working-directory: filtradores-sistema
        run: npm run lint
      - working-directory: filtradores-sistema
        run: npm run typecheck
      - working-directory: filtradores-sistema
        run: npm test
      - working-directory: filtradores-sistema
        run: npm run build
